# Tests every push and PR, and builds downloadable Mac + Windows bundles.
#
# Each bundle holds BOTH halves of the game: the terminal client and the relay
# (`sim-cli`, `sim-relay`) and the Godot client (`Assay.app` / `Assay.exe`),
# which carries the `sim-godot` library inside it so it runs the same Rust rules
# every other peer runs instead of a GDScript guess at them.
# One download, one run, same commit -- a tester cannot pair a client with a
# relay from a different build, which is the mistake the split used to invite.
# The relay is shipped beside the client, not inside it: a host starts the
# relay and everyone else types that address into the client's own host field.
#
# Where to get a bundle:
# - Any run: Actions tab → the run → "Artifacts" at the bottom (needs a
#   GitHub login).
# - Tagged builds: push a tag like `v0.1.0` and the zips are attached to a
#   GitHub Release, which anyone can download from the Releases page.
# - On demand: Actions tab → "Build" → "Run workflow".

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: sim-game

env:
  # Pinned: the editor that exports and the templates it exports with must be
  # the same build, and a floating "latest" would change what ships without a
  # commit. Both come from the public godotengine/godot releases -- an
  # anonymous download like crates.io, no account and nothing to buy.
  GODOT_VERSION: 4.6.1-stable
  # The folder Godot looks templates up in. NOT the same string as the tag.
  GODOT_TEMPLATE_DIR: 4.6.1.stable

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim-game
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # ONE SPECIES PALETTE, WRITTEN DOWN TWICE. The Blender pipeline tints the
      # ore sprite from `art/species_tints.py`; the Godot client fills a deposit
      # from a const in `client/scripts/hud.gd`. Neither language can read the
      # other's list, and the palette may not live in `sim` (principle 1), so
      # this is the only place the two can be held equal -- and the drift it
      # catches is invisible on screen: a wrong tint looks like a colour.
      # Stdlib only, no pip, ~0.1s.
      - name: The species palette agrees with itself
        run: python3 art/check_species_tints.py
      # THE ENGINE CAN REACH THE ART. For the pipeline's whole life the sheets
      # sat in `assets/sprites/`, the Godot project's SIBLING -- and `res://` is
      # the project folder and nothing above it, so no client script could load
      # one and no export packed one. Eleven files and four measured checks, and
      # the game had never drawn a pixel of any of it (ASSA-34). The sheets now
      # live in `client/assets/sprites/` and this is what fails if they drift
      # back out, or if an export filter starts excluding them -- a failure you
      # would otherwise only meet in a shipped bundle. Stdlib only, ~0.1s.
      - name: The client can reach the art
        run: python3 art/check_client_can_see_art.py
      # The client's own GDScript suite gates the bundles below. Editor only:
      # running tests needs no export templates, which is the ~1 GB download.
      - name: Godot (editor only)
        run: |
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip -d godot
          chmod +x "godot/Godot_v${GODOT_VERSION}_linux.x86_64"
      # The client loads the real `sim` through a GDExtension, so the engine
      # cannot even start without it: GODOT ABORTS (exit 134, a C++ stack trace,
      # no usable message) when a `.gdextension` names a library that is not
      # there -- measured 2026-10-01.
      #
      # Release so this job loads the same configuration the export jobs ship.
      # (I first used debug to reuse what `cargo test` compiled, saw `--import`
      # crash, and blamed debug for it in run 36942131128. Wrong: release
      # crashed identically, and the real cause is the import bug handled in the
      # next step. Debug would work; release is the better default anyway.)
      - name: The sim binding the client loads
        run: |
          cargo build -p sim-godot --release
          mkdir -p client/bin
          cp target/release/libsim_godot.so client/bin/
      # EVERY .gd FILE COMPILES, INCLUDING THE ONES NOTHING INSTANTIATES. The
      # suite below is a strong guard for loaded code and no guard at all for a
      # probe in `tools/`, which nobody loads until the moment they need it --
      # and Godot exits 0 on a parse error, so a file that cannot compile costs
      # nothing to ship. `project.godot` also makes unreachable code and
      # discarded expressions errors, so this gates those too. ~20s.
      # IMPORTED BEFORE ANYTHING READS THE PROJECT, and in its own step because
      # two things below need it. A `class_name` is only a global identifier once
      # the import has written `.godot/global_script_class_cache.cfg` -- without
      # it every file naming `AssayHud` fails to parse. That is exactly how the
      # compile check below passed on my machine, where `.godot/` already existed,
      # and failed on a fresh runner naming 16 files.
      - name: Import the client project
        working-directory: sim-game/client
        run: |
          GODOT="$GITHUB_WORKSPACE/sim-game/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          # THE FIRST IMPORT OF A PROJECT WITH A GDEXTENSION CRASHES ON EXIT,
          # and it is Godot's crash, not ours. The backtrace is Main::cleanup ->
          # CallQueue::flush -> EditorHelp::_gen_extensions_docs ->
          # DocTools::generate -> signal 11, i.e. the editor generating docs for
          # extension classes while shutting down -- long after the import work
          # itself finished. Measured both on this runner (run 36943152626) and
          # locally on 4.6.1, where deleting `.godot/` reproduces it every time
          # and the cache it leaves behind is complete.
          #
          # SO THE RETRY IS THE GATE, not a `|| true` that swallows everything:
          # the first run is allowed to die, the SECOND MUST EXIT 0 (measured:
          # it does, in 2s, because the cache is already there). The two export
          # jobs below do the same and say less.
          "$GODOT" --headless --import || "$GODOT" --headless --import
          grep -q 'sim.gdextension' .godot/extension_list.cfg
      # EVERY .gd FILE COMPILES, INCLUDING THE ONES NOTHING INSTANTIATES. The
      # suite below is a strong guard for loaded code and no guard at all for a
      # probe in `tools/`, which nobody loads until the moment they need it --
      # and Godot exits 0 on a parse error, so a file that cannot compile at all
      # costs nothing to ship. `project.godot` also makes unreachable code and
      # discarded expressions errors, so this gates those too. ~20s.
      - name: Every GDScript file compiles
        working-directory: sim-game/client
        run: |
          GODOT="$GITHUB_WORKSPACE/sim-game/godot/Godot_v${GODOT_VERSION}_linux.x86_64" \
            tools/check_every_script.sh
      - name: Client suite
        working-directory: sim-game/client
        run: |
          GODOT="$GITHUB_WORKSPACE/sim-game/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          "$GODOT" --headless --script tests/run_tests.gd | tee suite.log
          # GODOT EXITS 0 ON A COMPILE ERROR, so the count the runner prints is
          # the verdict and the exit code is not. Grep the file, never a pipe.
          grep -qE '^[0-9]+ passed, 0 failed' suite.log
      # THE LETTER ON A MAP DISC IS READABLE. Runs the client and scores what
      # `AssayHud.glyph_color` actually returned for all 600 species x purity
      # states (ASSA-39/44), rather than reimplementing the rule -- computing
      # both ratios here and asserting the better one is better would pass by
      # construction.
      #
      # OPTIMALITY IS DELIBERATELY DOUBLE-COVERED and I am saying so rather than
      # implying this step is load-bearing for it: `test_hud.gd` in the suite
      # above already asserts the same property in GDScript. Two independent
      # implementations in two languages agreeing is worth a few seconds on a
      # runner that already has Godot warm, but it is not why this step exists.
      #
      # WHAT ONLY THIS STEP GUARDS is the TINT TABLE, which is the art's problem
      # and mine: the worst letter available on any disc -- max(dark, light),
      # the ceiling of any possible picker -- must clear WCAG AA for normal text
      # (4.5, not large text's 3.0; `glyph_size` draws down to 10px). Today that
      # is 4.5152 at #FF80BF purity 24, a margin of ONE PART IN 300. If a tint
      # ever drops it under, no picking rule can rescue the glyph and the fix is
      # a design conversation about the tint. Nothing else in CI would notice.
      #
      # Exit codes are three-valued on purpose: 0 green, 1 the client or the
      # table is wrong, 2 NO VERDICT (engine unreachable) -- which fails the job
      # rather than passing quietly.
      - name: The letter on a map disc is readable
        run: |
          GODOT="$GITHUB_WORKSPACE/sim-game/godot/Godot_v${GODOT_VERSION}_linux.x86_64" \
            python3 art/check_glyph_contrast.py

  macos:
    name: macOS bundle
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim-game
      - name: Build for both Mac chips
        run: >
          cargo build --release -p sim-cli -p sim-relay -p sim-godot
          --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Bundle (universal binaries)
        run: |
          mkdir -p bundle/assay-macos
          for b in sim-cli sim-relay; do
            lipo -create \
              target/aarch64-apple-darwin/release/$b \
              target/x86_64-apple-darwin/release/$b \
              -output bundle/assay-macos/$b
            codesign -s - --force bundle/assay-macos/$b
          done
          cp packaging/README-macos.txt bundle/assay-macos/README.txt
          {
            echo "Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d)"
            echo "Godot client exported with $GODOT_VERSION"
          } > bundle/assay-macos/VERSION.txt
      - name: Godot and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}_macos.universal.zip"
          unzip -q godot.zip -d godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q templates.tpz -d templates
          dest="$HOME/Library/Application Support/Godot/export_templates"
          mkdir -p "$dest"
          mv templates/templates "$dest/$GODOT_TEMPLATE_DIR"
      # THE SIM, UNIVERSAL, WHERE THE CLIENT LOADS IT FROM. A `TickBundle`
      # carries inputs, so the world at tick N exists only once something runs
      # `sim::step`; that something is this library, never GDScript.
      #
      # Universal because the .app is (`binary_format/architecture="universal"`
      # in export_presets.cfg). This runner is Apple Silicon, so an arm64-only
      # library would load here, pass every check below, and fail on the first
      # tester with an Intel Mac.
      - name: The sim binding, for both Mac chips
        run: |
          mkdir -p client/bin
          lipo -create \
            target/aarch64-apple-darwin/release/libsim_godot.dylib \
            target/x86_64-apple-darwin/release/libsim_godot.dylib \
            -output client/bin/libsim_godot.dylib
          lipo -info client/bin/libsim_godot.dylib
      - name: Export the Godot client
        working-directory: sim-game/client
        run: |
          GODOT="$GITHUB_WORKSPACE/sim-game/godot/Godot.app/Contents/MacOS/Godot"
          # Said plainly here because the alternative is Godot aborting mid-export
          # with a C++ stack trace and no reason (exit 134, measured).
          test -f bin/libsim_godot.dylib \
            || { echo "no bin/libsim_godot.dylib: the step above did not run"; exit 1; }
          # First import crashes on exit in Godot's own doc generation; the
          # second must not. The long version is in the test job above.
          "$GODOT" --headless --import || "$GODOT" --headless --import
          grep -q 'sim.gdextension' .godot/extension_list.cfg
          # Godot DOES NOT CREATE THE OUTPUT FOLDER -- it fails with "Target
          # folder does not exist or is inaccessible" (measured 2026-10-01).
          mkdir -p ../bundle/assay-macos
          "$GODOT" --headless --export-release macOS ../bundle/assay-macos/Assay.app
          # Ad-hoc, same as the Rust binaries above: an unsigned universal .app
          # will not open on an Apple Silicon Mac at all. Not notarised, so the
          # first open is still right-click → Open.
          codesign -s - --force --deep ../bundle/assay-macos/Assay.app
          codesign -dv ../bundle/assay-macos/Assay.app
          # The exporter copies a .gdextension's libraries into the bundle
          # (Contents/Frameworks, measured locally). Said out loud because the
          # selfcheck below would otherwise be the only thing standing between a
          # silently library-less .app and a tester.
          find ../bundle/assay-macos/Assay.app -name 'libsim_godot.dylib' | grep .
      - name: The exported client runs
        # A HANG IS A FAILURE AND MUST LOOK LIKE ONE. The self-check takes under a
        # second; before ASSA-51 this step sat for 45 MINUTES on every merge,
        # because a GUI binary whose main script failed to parse never reaches the
        # `quit()` in `_ready` and just waits on the platform event loop. Three
        # merges' worth of runs did that, on macOS at 10x minutes, and the job
        # would have run to the 6-hour default. Two minutes is ~100x the honest
        # cost of this step, so anything over it is a defect and not a slow runner.
        timeout-minutes: 2
        run: |
          # AN EXPORT CAN SUCCEED AND SHIP A PACK THAT WILL NOT LOAD, and the
          # exit code of a missing or broken binary can still be 0 (measured),
          # so the marker file this writes LAST is the verdict. It now also
          # covers the sim binding: the check steps a small world through the
          # library and through `sim::step` directly and compares the two
          # hashes, so a library that shipped but will not load is caught here
          # rather than by the first player who tries to see tick N.
          rm -f selfcheck.txt
          bundle/assay-macos/Assay.app/Contents/MacOS/Assay \
            --headless -- --selfcheck "$PWD/selfcheck.txt"
          cat selfcheck.txt
          grep -qx 'CLIENT SELFCHECK OK' selfcheck.txt
          rm selfcheck.txt
      # ASSA-40: the rules this bundle plays, in the run log, so a tester's
      # zip can be paired with a running relay by reading rather than by
      # `lsof` and a binary mtime. The relay prints the same line on start
      # and refuses a peer that disagrees.
      - name: Rules identity
        run: |
          id=$(bundle/assay-macos/sim-cli --plain </dev/null | sed -n 's/^rules \([0-9a-f]*\).*/\1/p')
          test -n "$id" || { echo "sim-cli did not print a rules identity"; exit 1; }
          # In VERSION.txt as well as the log: the log is for whoever hosts,
          # the file travels with the zip for whoever downloads it.
          echo "Game rules $id (a host on other rules will refuse this build)" \
            >> bundle/assay-macos/VERSION.txt
          echo "assay-macos rules identity: $id"
          echo "assay-macos rules identity: \`$id\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Zip
        run: cd bundle && ditto -c -k --keepParent assay-macos assay-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: assay-macos
          path: sim-game/bundle/assay-macos.zip
          if-no-files-found: error

  windows:
    name: Windows bundle
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim-game
      # The sim binding is built in the SAME invocation, with the same flags, on
      # purpose: it ships to players too, so it must not be the one file in the
      # zip that needs a VC++ redistributable. Separate invocations with
      # different RUSTFLAGS would also recompile the whole dependency graph.
      - name: Build (static C runtime, no VC++ redistributable needed)
        run: cargo build --release -p sim-cli -p sim-relay -p sim-godot
        env:
          RUSTFLAGS: -C target-feature=+crt-static
      - name: Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bundle/assay-windows | Out-Null
          Copy-Item target/release/sim-cli.exe, target/release/sim-relay.exe bundle/assay-windows/
          Copy-Item packaging/README-windows.txt bundle/assay-windows/README.txt
          @(
            "Built from $($env:GITHUB_SHA.Substring(0,7)) on $(Get-Date -Format yyyy-MM-dd -AsUTC)"
            "Godot client exported with $($env:GODOT_VERSION)"
          ) | Set-Content bundle/assay-windows/VERSION.txt
      - name: Godot and export templates
        shell: pwsh
        run: |
          $base = "https://github.com/godotengine/godot/releases/download/$($env:GODOT_VERSION)"
          Invoke-WebRequest "$base/Godot_v$($env:GODOT_VERSION)_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
          # Expand-Archive only takes a .zip name, and a .tpz is a zip.
          Invoke-WebRequest "$base/Godot_v$($env:GODOT_VERSION)_export_templates.tpz" -OutFile templates.zip
          Expand-Archive templates.zip -DestinationPath templates
          $dest = "$($env:APPDATA)\Godot\export_templates"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Move-Item templates/templates "$dest\$($env:GODOT_TEMPLATE_DIR)"
      - name: Export the Godot client
        shell: pwsh
        working-directory: sim-game/client
        run: |
          # THE _console WRAPPER, NOT THE PLAIN .exe. The plain Windows editor
          # is a GUI-subsystem binary: launched from a shell it prints its
          # banner, detaches and returns 0 immediately, so the export never
          # happens and nothing reports it. That is how this job first failed
          # (run 36925261824): the export "passed" in 0.5s and the error
          # surfaced two steps later as a missing file. The wrapper is what
          # makes every exit code below mean something.
          $godot = "$($env:GITHUB_WORKSPACE)\sim-game\godot\Godot_v$($env:GODOT_VERSION)_win64_console.exe"
          # THE SIM BINDING, WHERE sim.gdextension LOOKS FOR IT. A TickBundle
          # carries inputs, so the world at tick N exists only once something
          # runs sim::step, and that something is this DLL, never GDScript.
          # Godot ABORTS mid-export (exit 134, a C++ stack trace, no reason)
          # when a .gdextension names a library that is not there, so say it
          # here instead.
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item ../target/release/sim_godot.dll bin/
          if (-not (Test-Path bin/sim_godot.dll)) { throw "no bin/sim_godot.dll to export with" }
          # First import crashes on exit in Godot's own doc generation for
          # extension classes; the second must not. The long version is in the
          # test job above.
          & $godot --headless --import
          if ($LASTEXITCODE -ne 0) {
            Write-Host "first --import exited $LASTEXITCODE; retrying once"
            & $godot --headless --import
            if ($LASTEXITCODE -ne 0) { throw "godot --import exited $LASTEXITCODE twice" }
          }
          if (-not (Select-String -Path .godot/extension_list.cfg `
              -Pattern 'sim.gdextension' -Quiet)) {
            throw "the import registered no sim.gdextension"
          }
          # Godot does not create the output folder (measured on macOS; same
          # exporter). The preset embeds the pack, so this is one .exe.
          New-Item -ItemType Directory -Force ../bundle/assay-windows | Out-Null
          & $godot --headless --export-release "Windows Desktop" ../bundle/assay-windows/Assay.exe
          if ($LASTEXITCODE -ne 0) { throw "the export exited $LASTEXITCODE" }
          # The export step proves its own output rather than leaving it to the
          # next one.
          if (-not (Test-Path ../bundle/assay-windows/Assay.exe)) {
            Get-ChildItem ../bundle/assay-windows
            throw "the export reported success but wrote no Assay.exe"
          }
          # The pack is embedded in the .exe, but a GDExtension library cannot be
          # -- the OS loads it as a file. Where the exporter puts it is its
          # business; that it is IN the zip is ours.
          $lib = Get-ChildItem -Recurse ../bundle/assay-windows -Filter sim_godot.dll
          if (-not $lib) {
            Get-ChildItem -Recurse ../bundle/assay-windows | Select-Object -Expand FullName
            throw "the export shipped no sim_godot.dll, so the client cannot run the sim"
          }
          $lib.FullName
      - name: The exported client runs
        # See the macOS job's copy of this step: a hang here is a parse error in a
        # shipped script, not a slow runner (ASSA-51).
        timeout-minutes: 2
        shell: pwsh
        run: |
          # The only check the Windows build gets: nobody at the studio has a
          # Windows machine, but the runner can run what it just built. The
          # marker file is the verdict, for the reasons in selfcheck.gd. It is
          # also the only proof that the sim binding loads on Windows at all.
          $marker = Join-Path $pwd 'selfcheck.txt'
          Remove-Item $marker -ErrorAction SilentlyContinue
          # START-PROCESS IGNORES POWERSHELL'S CURRENT DIRECTORY: it resolves a
          # relative path against the process's own and fails with "The system
          # cannot find the file specified" (measured, run 36925261824). So:
          # absolute, via Resolve-Path, which also throws if it is not there.
          $exe = (Resolve-Path bundle/assay-windows/Assay.exe).Path
          # The exported client is GUI-subsystem too, hence -Wait.
          $p = Start-Process -FilePath $exe `
            -ArgumentList '--headless', '--', '--selfcheck', $marker `
            -Wait -PassThru -NoNewWindow
          if (-not (Test-Path $marker)) { throw "the exported client wrote no marker" }
          Get-Content $marker
          if ($p.ExitCode -ne 0) { throw "the exported client exited $($p.ExitCode)" }
          if (-not (Select-String -Path $marker -Pattern '^CLIENT SELFCHECK OK$' -Quiet)) {
            throw "the exported client failed its self-check"
          }
          Remove-Item $marker
      # ASSA-40, same as the macOS job. The two identities from one commit
      # must MATCH: the fingerprint drops carriage returns precisely so a
      # CRLF checkout here agrees with the Mac, and a tester pairing a
      # Windows zip to a Mac-hosted relay depends on it.
      - name: Rules identity
        shell: pwsh
        run: |
          $out = $null | bundle/assay-windows/sim-cli.exe --plain
          $id = ($out | Select-String -Pattern '^rules ([0-9a-f]+)').Matches.Groups[1].Value
          if (-not $id) { throw "sim-cli did not print a rules identity: $out" }
          Add-Content bundle/assay-windows/VERSION.txt `
            "Game rules $id (a host on other rules will refuse this build)"
          Write-Output "assay-windows rules identity: $id"
          Add-Content $env:GITHUB_STEP_SUMMARY "assay-windows rules identity: ``$id``"
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path bundle/assay-windows -DestinationPath bundle/assay-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: assay-windows
          path: sim-game/bundle/assay-windows.zip
          if-no-files-found: error

  release:
    name: Attach bundles to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
      - uses: softprops/action-gh-release@v2
        with:
          files: bundles/**/*.zip
          generate_release_notes: true
