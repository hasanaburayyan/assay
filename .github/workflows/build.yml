# Tests every push and PR, and builds downloadable Mac + Windows bundles.
#
# Each bundle holds BOTH halves of the game: the terminal client and the relay
# (`sim-cli`, `sim-relay`) and the Godot client (`Assay.app` / `Assay.exe`),
# which carries the `sim-godot` library inside it so it runs the same Rust rules
# every other peer runs instead of a GDScript guess at them.
# One download, one run, same commit -- a tester cannot pair a client with a
# relay from a different build, which is the mistake the split used to invite.
# The relay is shipped beside the client, not inside it: a host starts the
# relay and everyone else types that address into the client's own host field.
#
# Where to get a bundle:
# - Any run: Actions tab → the run → "Artifacts" at the bottom (needs a
#   GitHub login).
# - Tagged builds: push a tag like `v0.1.0` and the zips are attached to a
#   GitHub Release, which anyone can download from the Releases page.
# - On demand: Actions tab → "Build" → "Run workflow".

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      # OFF BY DEFAULT, AND OFF FOR EVERY PUSH AND PR. The motion probe below
      # opens a real window on a runner with no GPU: it is an experiment whose
      # failure is a result (ASSA-205), so it must never be able to redden the
      # bundle the board downloads, and nobody dispatching a build to get a zip
      # should pay fifteen minutes for it.
      #   gh workflow run build.yml --ref <branch> -f motion_probe=true
      motion_probe:
        description: "Also run the Windows motion probe (ASSA-205)"
        type: boolean
        default: false
      motion_seconds:
        description: "Seconds to watch the body walk, per attempt"
        type: string
        default: "8"

defaults:
  run:
    working-directory: sim-game

env:
  # Pinned: the editor that exports and the templates it exports with must be
  # the same build, and a floating "latest" would change what ships without a
  # commit. Both come from the public godotengine/godot releases -- an
  # anonymous download like crates.io, no account and nothing to buy.
  GODOT_VERSION: 4.6.1-stable
  # The folder Godot looks templates up in. NOT the same string as the tag.
  GODOT_TEMPLATE_DIR: 4.6.1.stable

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` for the revert guard below: it asks what each changed
      # file USED to contain, which a depth-1 clone cannot answer. Only this
      # job needs it; the bundle jobs stay shallow.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # MAIN BEING GREEN AND MAIN STILL CONTAINING WHAT WAS MERGED ARE TWO
      # CLAIMS, AND ONLY THE FIRST WAS AUTOMATED (ASSA-75, Limpet's words on
      # ASSA-72). My #97 squashed with `git reset --soft` onto a base my index
      # did not match, so it carried a byte-exact revert of ten of Limpet's
      # files -- a CI guard and its own step among them. `git status` and
      # `git diff` were both clean, and the Rust gate passed because the files
      # it threw away were GDScript, Python and this workflow.
      #
      # Two rules: a file's new content may not equal a blob it already had
      # before the base, and a deleted path must be named in a commit message.
      # Saying what you did is the escape hatch -- there is no flag -- which
      # also covers the innocent case of a regenerated art sheet coming out
      # byte-identical to an older one.
      #
      # Measured before wiring it: over main's last 30 merges it flags exactly
      # one commit, #97, with exactly the ten files Limpet listed by hand.
      #
      # AND THE DECLARATION HAS TO BE IN A COMMIT MESSAGE, NOT IN `PR_BODY`
      # BELOW (ASSA-250). Both rules used to accept either. GitHub sets
      # `PR_BODY` on a `pull_request` event and leaves it empty on the push
      # that judges the squash commit, so a PR-body declaration cleared the one
      # run where it could still be fixed and was absent from the run that
      # enforces it: #323 and #330 were both green as PRs and red on main
      # sixteen seconds after merging, and the second stood unnamed for three
      # hours. A finding that only `PR_BODY` clears is now its own finding, at
      # PR time. The variable is still passed -- that is how the guard can tell
      # the two apart and name it.
      #
      # Same hole as the check below, and said in the file too: a commit that
      # takes this script and this step together passes, because CI config
      # comes from the commit under test. A person reading main's diff after a
      # merge is still the backstop. Stdlib only, no network, ~1s.
      - name: Nothing put back as it was, nothing deleted in silence
        run: python3 ../tools/revert_guard.py
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
      # THE GUARD ABOVE SHIPPED WITH NO TEST, which is how the hole survived
      # from #107 until someone merged into it twice in one afternoon: the only
      # thing exercising it was the step above, against whatever trees happened
      # to exist. This builds four throwaway repositories and asks it the four
      # questions, including the one it used to get wrong. Deliberately not
      # `check_*.py`: that prefix in this file is a promise to
      # `art/check_ci_runs_every_check.py` that a file of that name sits in
      # `art/`. Stdlib and git only, no network.
      - name: The revert guard answers the four questions
        run: python3 ../tools/test_revert_guard.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim-game
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # A CHECK AND ITS OWN STEP LAND AND LEAVE TOGETHER (ASSA-72). #97 deleted
      # `art/check_pack_icon_scale.py` AND removed its step below in one commit,
      # so main went back to drawing pack icons at 15/32 and CI stayed green --
      # there was nothing left to fail. This holds the set of `art/check_*.py`
      # files equal to the set `build.yml` names, so either half going missing
      # reddens: an unreferenced check, or a step naming a file that is gone.
      #
      # IT ALSO CATCHES THE FORWARD CASE nobody has been burnt by yet: a new
      # check landing wired to nothing, which is silent for exactly as long as
      # it takes someone to assume it is running.
      #
      # WHAT IT DOES NOT COVER, and it is in the file too rather than only here:
      # a stale-tree commit that takes a check, its step and THIS step in one go
      # still passes, because CI config comes from the commit under test. A repo
      # cannot hold a guard its own PR cannot remove. #97 was caught by a person
      # reading main's diff after the merge, and that is still the backstop.
      # Stdlib only, no Godot, ~0.05s.
      - name: Every art check is actually run by CI
        run: python3 art/check_ci_runs_every_check.py
      # THE SAME QUESTION FOR `client/tools/`, WHICH COULD NOT BE ASKED THE SAME
      # WAY (ASSA-282). `art/check_*.py` has one class -- every check should run
      # -- so a set difference answers it. `client/tools/` has two, and most of it
      # SHOULD stay local: the shots write a blank frame headless, and the budget
      # probe measures a clip that reads 0 px without a window. So the FILE
      # declares `# CI: gated`, `# CI: local -- <why not>` or `# CI: library`, and
      # this holds the claim to the tree in both directions: a tool that says
      # gated and is wired to nothing reddens, and so does one that says local
      # after somebody wired it up and did not edit its header.
      #
      # IT FOLLOWS INDIRECTION, and that is not theoretical: the gate reaches
      # `hud_probe.gd` only through `tools/hud_in_a_gate.sh`, so a grep of this
      # file for the filename would have called the probe ungated. It also strips
      # YAML comment lines first, because `window_shot.gd` is named in this file
      # inside a comment saying why nothing runs it. Stdlib only, no Godot.
      - name: Every client tool says whether a gate runs it
        run: python3 client/tools/check_tools_declare_ci.py
      # THE SUITE POKES A CONTROL IN EXACTLY ONE PLACE (ASSA-312). A project-themed
      # control resolves the PLAIN type's entries until it gets
      # NOTIFICATION_THEME_CHANGED, which frames do not deliver, so every headless
      # theme read is wrong until poked. The poke was hand-rolled in two test files
      # and ASSA-267 showed what that costs: it removed the one override propping up
      # a raw read in `test_tab_strip.gd` and 16 assertions went red against a theme
      # that was already CORRECT. Nothing had broken; the prop went away and nothing
      # said so. Both arms are checked -- a poke outside the helper fails, and the
      # helper holding ZERO pokes fails too, so deleting the thing under test cannot
      # earn the green. Stdlib only, no Godot, milliseconds.
      - name: The theme poke lives in exactly one place
        run: python3 client/tools/check_one_theme_poke.py
      # ONE SPECIES PALETTE, WRITTEN DOWN TWICE. The Blender pipeline tints the
      # ore sprite from `art/species_tints.py`; the Godot client fills a deposit
      # from a const in `client/scripts/hud.gd`. Neither language can read the
      # other's list, and the palette may not live in `sim` (principle 1), so
      # this is the only place the two can be held equal -- and the drift it
      # catches is invisible on screen: a wrong tint looks like a colour.
      # Stdlib only, no pip, ~0.1s.
      - name: The species palette agrees with itself
        run: python3 art/check_species_tints.py
      # NO SHIPPED SURFACE SITS ON THE CEILING (ASSA-115). A pixel with a
      # channel pinned at 255 has no shading left, and because the client tints
      # ore with Godot's `modulate` -- a per-channel MULTIPLY -- a pinned
      # channel maps to EXACTLY the species hex. So a blown region does not
      # read as a bright rock, it reads as a flat patch of species colour.
      #
      # Three assets fell off the top of the rig independently and were written
      # up as three separate bugs (ASSA-28's grade-A chassis matching a hopper,
      # the grade-A glint landing on a species yellow, 34% of a grade-A ore tile
      # going flat). One cause: `Standard` is a hard clip and a lit face of this
      # rig was about a stop over it, so every albedo above 192 rendered as the
      # same white. 15.7% of ALL shipped pixels were sitting there and nothing
      # asked. The fix was one line in rig.py, which is exactly the kind of line
      # that gets spent again by anyone adding a lamp or lightening a palette
      # entry -- hence a guard rather than a commit message.
      #
      # The bound is a RATCHET of measurements, not a number anyone picked: a
      # glint is SUPPOSED to blow out, so the honest limit is not zero, and this
      # file holds what each row does today and fails if any row gets worse.
      # Proved red before it was trusted green -- it fails on the pre-fix sheets
      # with 25 rows over, player/walk_SW worst at 47.6%. Stdlib only, ~3s.
      - name: No shipped surface sits on the ceiling
        run: python3 art/check_headroom.py
      # GRADE-A ORE IS CLUMPED, AND NOTHING ELSE HERE CAN SEE THAT (ASSA-216).
      # Maren's ruling was arrangement, not value: the same rocks, the same
      # sizes, the same colours and -- since `relax()` -- the same coverage,
      # gathered into clumps that straddle a tile's joins, because a uniform
      # scatter integrates to one flat yellow mass at 1x. Every quantity the
      # other checks measure is deliberately unchanged by that, so all of them
      # would stay green on a revert. This measures the GAP a clump makes: mean
      # distance from open ground to the nearest rock, wrapping. Proved red
      # before it was trusted green -- the pre-clump sheet fails all four rows
      # (`art/check_clumped.py <old sheet.png>` judges any sheet, so anyone can
      # repeat that). Stdlib only, 0.1s.
      - name: Grade-A ore still reads as clumps
        run: python3 art/check_clumped.py
      # THE GROUND HAS FORM ABOVE A TILE, AND NOTHING ELSE CAN SEE IT (ASSA-150). `ground.py`'s
      # first three layers are drawn inside the per-cell loop, so they cannot make a feature
      # bigger than 32 px however they are arranged; the fourth, the mottle, is drawn once over
      # the whole field and is the only one that can. It changes no palette entry, no tone
      # budget, no coverage and no row, so every other art check stays green if someone sets
      # `MOTTLE_BLOBS = 0`. This measures what "bigger than a tile" means: whether two cells
      # side by side know anything about each other. Proved red before it was trusted green --
      # the pre-mottle ground fails both axes (-0.097 / +0.062 against a floor of 0.20), and
      # `art/check_ground_form.py <sheet.png>` judges any sheet so anyone can repeat it.
      # Stdlib only, 0.3s.
      - name: The ground still has form above a tile
        run: python3 art/check_ground_form.py
      # THE PACK PLATE'S DERIVATION, NOT THE PLATE (ASSA-261). `check_pack_icon_plate.py` further
      # down guards an IDENTITY -- the sheet, the shipped ui_theme.json and the colour the engine
      # painted agree -- and it is blind to that colour being computed by the wrong statistic. It
      # passed every day the plate came from a per-channel MEDIAN while 32.5% of the ground sat on
      # one luminance level and the median sat on that spike, leaving the plate 3.2 levels off the
      # ground it is defined to BE (ASSA-71). A tolerance on the real sheet would be circular, so
      # this guards the derivation on SYNTHETIC sheets whose right answer is arithmetic: a majority
      # spike must not capture it (fails a median), it must round rather than truncate (fails
      # int(), worth half a level per channel on every build), and it must resist a small one-sided
      # tail (fails a bare mean, which is why Maren's call was "trimmed, not bare"). Proved red on
      # the real previous file, not on a mutant: `art/check_plate_statistic.py <dir>` judges any
      # copy of ui_theme.py, and 62835a2's fails property 1. Stdlib only; it encodes three
      # 120x120 sheets and reads them back through the shipped decoder. No wall-clock figure
      # here on purpose -- the studio Mac is too loaded this week for an honest one, and the
      # other comments' times were measured when it was not.
      - name: The pack plate's statistic still has all three properties
        run: python3 art/check_plate_statistic.py
      # WHEN THE ENGINE PROBE FAILS, THE HELPER HAS TO NAME THE CAUSE (ASSA-268). Three checks ask
      # the engine what it laid out through `ask_layout.ask_the_engine`, and when the probe prints
      # no LAYOUT_JSON it tries to say why. That explanation is prose and nothing had ever read it.
      # It was wrong two ways, both found by losing an hour to them: it knew "the binding is
      # MISSING" but not "the binding is STALE" -- present, but older than the GDScript calling it,
      # which is the likeliest failure in a working checkout since sim-godot gains methods on main
      # while a local build sits still -- and it printed blob[-1200:], the TAIL, when a compile
      # failure announces itself at the top and then repeats a consequence every frame (97,110
      # times, 874,015 lines, in the recorded case). This reads both off a RECORDING of the real
      # failing run, `art/fixtures/stale_binding.txt`, not off sentences invented to match: on that
      # blob every string the old code tested for appears zero times. Proved red on the old logic,
      # which reports no cause at all and an excerpt with the spin loop in it. Stdlib, no Godot.
      - name: A failed engine probe still says why
        run: python3 art/check_ask_layout.py
      # A FIRE IS NOT MADE OF THE WALLS (ASSA-137). The check above guards the
      # surfaces the species tint MAY shade; this one guards the rows it may
      # not touch at all. The client tints a world sprite with `modulate`, a
      # per-channel multiply, which is right for a wall made of the species and
      # has no bottom for a pixel standing for emitted light: Maren measured the
      # shipped smelter and the brightest pixel of a burning fire came out BELOW
      # the ground's median luminance in three of the six species, and the one
      # the demo actually plants cleared it by 11.7. The fire is now its own
      # manifest row flagged `light`, drawn untinted over the tinted body.
      #
      # This fails if that comes undone: the derivation stops giving the hot
      # core alpha 1, or a renderer puts a light row back through a tint. Its
      # can-fail control is the defect itself -- it re-multiplies the light rows
      # every run and must be rejected -- and doing that reproduces Maren's
      # table to the decimal. Stdlib only, ~2s.
      - name: Light rows are not made of the species
        run: python3 art/check_light_rows.py
      # ground.png IS STILL ONE PICTURE (ASSA-115 box 2, ASSA-168). The sixty-four
      # rows of that sheet are not variants, they are the row-major cells of ONE
      # continuous 8x8-tile render, and `scene_view.gd::ground_row` places them BY
      # POSITION because a patch crossing a cell boundary is the same object in
      # both cells. Re-render the field as sixty-four independent images and every
      # tile join in the game becomes a seam between strangers -- the mosaic of
      # strangers QA could point at before #220, which measured Z +10.2 against
      # its interior offsets.
      #
      # WHY CI CAN RUN THIS AT ALL, since ASSA-162 says it cannot: that item is
      # about a WINDOW shot, and `window_shot.gd` under `--headless` writes a
      # blank frame and still exits SUCCESS. A seam at a cell join is a property
      # of the SHEET, so it needs no camera, no downsample and no placement rule
      # -- it is measured at the native 64 px with the bar IMPORTED from
      # `grid_findability.py`, the same 3-sd magnitude that judges a real shot.
      #
      # Its can-fail control runs every pass and is arithmetic rather than a
      # shuffle: a shuffle can leave cells field-adjacent by luck and I measured
      # one going green. Lifting a checkerboard of cells by 8 L steps every join
      # in both directions by construction, and if that is not caught this exits
      # 2 instead of reporting a pass. It also refuses to go to sleep: the block
      # shape is read from the shipped manifest, and a manifest that stops
      # declaring one is NO VERDICT, not green.
      #
      # WHAT ONLY THIS STEP GUARDS is the ART. The other half -- the client
      # changing its mind about placement -- is `test_scene_view.gd`'s block test
      # in the suite above, which reads the same manifest. Neither covers the
      # other. Stdlib only, no Godot, no Pillow, ~0.7s.
      - name: The ground sheet is still one picture
        run: python3 art/check_ground_block.py
      # A SCATTER LANDMARK IS VISIBLE ON THE GROUND IT IS DRAWN ON. The Game
      # Director's floor, made executable: p50 >= 10 dE per-pixel, per landmark
      # row, against all 64 ground cells (ASSA-202). It exists because `tuft0`
      # was built out of four ground tones mixed with each other and shipped at
      # p50 3.5 -- a prop nobody could see -- while the LAYER's aggregate dE of
      # 17.5 passed its acceptance box and hid it. A mean over a patch with
      # internal structure cannot report that patch invisible. Grit is exempt by
      # name: texture is allowed to be quiet, landmarks are not. The same step
      # refuses an odd authored frame, which does not halve onto whole drawn
      # pixels. Stdlib only, no Godot, no Pillow, ~2s.
      - name: Scatter landmarks are visible on the ground
        run: python3 art/check_scatter.py
      # THE ENGINE CAN REACH THE ART. For the pipeline's whole life the sheets
      # sat in `assets/sprites/`, the Godot project's SIBLING -- and `res://` is
      # the project folder and nothing above it, so no client script could load
      # one and no export packed one. Eleven files and four measured checks, and
      # the game had never drawn a pixel of any of it (ASSA-34). The sheets now
      # live in `client/assets/sprites/` and this is what fails if they drift
      # back out, or if an export filter starts excluding them -- a failure you
      # would otherwise only meet in a shipped bundle. Stdlib only, ~0.1s.
      - name: The client can reach the art
        run: python3 art/check_client_can_see_art.py
      # THE RULES THAT TURN PARTS INTO A MACHINE ARE SHIPPED, AND STILL TRUE.
      # The sheets say how to slice frames and nothing says how to COMBINE
      # them, so `client/assets/sprites/part_layout.json` carries the repeat
      # offset and the shadow ceiling out of `art/part_layout.py` (ASSA-54).
      # A client that instead blits part frames at one position with the
      # default operator gets both defects this pipeline already measured and
      # rejected: the second hopper adds 25 px at 1x instead of 108 (that is
      # antialiasing, not a part) and the darkest contact shadow runs
      # 128 -> 221 over four hoppers, so shadow darkness reports part count.
      # This fails if the shipped file and the module ever disagree -- a
      # constant that ships is a copy, and copies rot. Stdlib only, ~0.1s.
      - name: The part-layout contract matches its module
        run: python3 art/check_part_contract.py
      # A PART FITS INSIDE THE FRAME IT IS RENDERED IN, ON ALL FOUR SIDES (ASSA-104).
      # rig.py's rule 4 treated exactly this as a defect on the VERTICAL axis -- the
      # hopper's mouth was once clipped flat against row 0 -- and the horizontal axis
      # had no equivalent, so handle and frame ran 2 px off their west edge with no ink
      # rim for as long as nobody measured it. A body pixel ON the boundary means the
      # rim that closes that side was never rendered, which is why "touches the edge"
      # is the whole rule and nothing here tries to detect a rim.
      #
      # The margin is deliberately ONE pixel (Maren's ruling, rule 4b): the fix moves
      # the camera window 3 px, not the frame size, because widening a part frame would
      # shrink the pack icon on the one surface where a part reaches a player. So this
      # check is expected to be TIGHT. If a future shape eats that pixel it goes red and
      # somebody looks, which is the check working rather than a bound to pad.
      #
      # Proved red before it was trusted green: it fails on the pre-fix sheets with
      # "handle CUT west 19 px / frame CUT west 58 px" per grade row. Stdlib only.
      - name: A part fits inside its own frame
        run: python3 art/check_part_frame_fit.py
      # A PLANTED MACHINE READS AGAINST THE ORE OF ITS OWN SPECIES (ASSA-159, Maren's ask).
      # A drill must stand ON a deposit to run, and a building and the ore of its species
      # are modulated by the IDENTICAL `Color` (scene_view.gd:239 and :314 -> sprites.gd:226
      # -> hud.gd:200), with no purity dim on that path. So the only thing stopping the
      # first machine a player builds from being camouflaged against the ground it stands
      # on is the greyscale art underneath -- which a re-render can walk back with nothing
      # going red.
      #
      # It needs no window shot, which is the whole reason it may be a `check_` at all: the
      # shared tint cancels in a RATIO, so the measurement falls out of the shipped sheets
      # and SPECIES_TINTS, headless, in under a second. Contrast `art/grid_findability.py`,
      # which judges a window shot and therefore cannot be wired here.
      #
      # Its red control is a real commit rather than a synthetic sheet:
      # FAKE_PART_SHEETS=<a checkout of main before ASSA-159> reports 1.49 against the
      # 3.00 bar -- the camouflaged drill itself. Stdlib only.
      - name: A planted machine reads against its own ore
        run: python3 art/check_machine_vs_own_ore.py
      # A COMMITTED REVIEW SHEET STILL MATCHES THE ART IT DREW (ASSA-144, Maren's ruling).
      # `assets/review/` holds nine tracked PNGs and this repo's own CLAUDE.md says to
      # judge the art off one of them, so a stale one is believed -- and it is believed
      # about a game it no longer describes. It has happened: the pack sheet's slot plate
      # was #889868 while the shipped ground's median had moved to #879A66, and nothing
      # in the repo could tell. Two more were stale when this landed: `assembled.png`
      # predated ASSA-124's frame re-render by 87,806 px, `mock_scene.png` predated
      # ASSA-137's light rows by 11,674.
      #
      # NOT A HASH OF THE SHEET'S PIXELS, which is Cove's ruling: that goes red on every
      # legitimate re-render and "a check that cries wolf is a check that gets
      # regenerated blind". The generators stamp the identity of their SOURCES instead
      # (`review_sources.py` records the shipped files each one actually opens), so
      # redrawing a sheet from unchanged art is green and moving the art under a sheet
      # nobody redrew is red, naming the file.
      #
      # TWO ANTI-VACUITY CHECKS RUN INSIDE IT, because "no source moved" is trivially
      # true of a sheet that recorded nothing: one sheet must carry a non-empty source
      # list, and the recorder must still observe all four ways this pipeline opens a
      # file -- including `Path.read_bytes()`, which patching `builtins.open` alone
      # measurably misses. Either failing exits 2, not 0.
      #
      # Lever: REVIEW_SOURCES_FAKE_MOVE=ground.png must turn it red, naming every sheet
      # that composited ground.png. Proved red for real too, by appending a byte to a
      # shipped sprite and restoring it. Stdlib only, ~0.2s.
      - name: A review sheet still matches the art it drew
        run: python3 art/check_review_sources.py
      # THE ARITHMETIC HALF OF THE WINDOW ALPHA PROBE (ASSA-181, Maren's ruling 15:05).
      #
      # `art/window_alpha.py` is NOT a `check_*.py` and most of it still cannot be wired
      # here: `control` and `field` need a real GUI Godot run, like `grid_findability.py`.
      # But `--selftest` needs no Godot, no shots and no pip -- it round-trips 8,704
      # simulated pixels through the client's own blend plus a 32,768-pair coverage sweep,
      # all stdlib, ~2s. The item's box said "not wired because it needs a GUI run", which
      # was true of the GUI half and false of this one. THAT IS THE WHOLE REASON FOR THE
      # STEP: four masks lied in one day and this is the instrument that replaced them, so
      # it must not rot unnoticed.
      #
      # IT IS NOT DECORATION -- all four arms have been proved red. A x10 widening mutant
      # on `alpha_of` exits 1 on the COVERAGE arm, and COVERAGE is the ONLY arm that
      # catches it: containment, the colour arm and UNSTABLE all stay green, because
      # widening a bound cannot make a contained value escape. That is the gate's entire
      # point.
      - name: The window alpha probe still does its own arithmetic
        run: python3 art/window_alpha.py --selftest
      - name: A tester can find the motion probe without being told
        # **THE ROUTE IS HALF THE INSTRUMENT** (ASSA-211). A flag only the people who
        # wrote it know about cannot answer "it is jumpy on my PC": the ask has to be
        # one line a stranger can paste, and the place a stranger looks is the README
        # inside the zip they just unpacked. These files live outside `client/`, so no
        # GDScript test can reach them -- and "nothing tests prose" is how this repo
        # has shipped wrong sentences before (ASSA-207), so the grep lives here.
        run: |
          for f in packaging/README-macos.txt packaging/README-windows.txt; do
            grep -q -- '--motion-probe' "$f" \
              || { echo "$f does not tell a tester how to run the motion probe"; exit 1; }
            grep -q 'motion.txt' "$f" \
              || { echo "$f does not name the file the tester is meant to send back"; exit 1; }
          done
      # The client's own GDScript suite gates the bundles below. Editor only:
      # running tests needs no export templates, which is the ~1 GB download.
      - name: Godot (editor only)
        run: |
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip -d godot
          chmod +x "godot/Godot_v${GODOT_VERSION}_linux.x86_64"
      # The client loads the real `sim` through a GDExtension, so the engine
      # cannot even start without it: GODOT ABORTS (exit 134, a C++ stack trace,
      # no usable message) when a `.gdextension` names a library that is not
      # there -- measured 2026-10-01.
      #
      # Release so this job loads the same configuration the export jobs ship.
      # (I first used debug to reuse what `cargo test` compiled, saw `--import`
      # crash, and blamed debug for it in run 36942131128. Wrong: release
      # crashed identically, and the real cause is the import bug handled in the
      # next step. Debug would work; release is the better default anyway.)
      - name: The sim binding the client loads
        run: |
          cargo build -p sim-godot --release
          mkdir -p client/bin
          cp target/release/libsim_godot.so client/bin/
      # EVERY .gd FILE COMPILES, INCLUDING THE ONES NOTHING INSTANTIATES. The
      # suite below is a strong guard for loaded code and no guard at all for a
      # probe in `tools/`, which nobody loads until the moment they need it --
      # and Godot exits 0 on a parse error, so a file that cannot compile costs
      # nothing to ship. `project.godot` also makes unreachable code and
      # discarded expressions errors, so this gates those too. ~20s.
      # IMPORTED BEFORE ANYTHING READS THE PROJECT, and in its own step because
      # two things below need it. A `class_name` is only a global identifier once
      # the import has written `.godot/global_script_class_cache.cfg` -- without
      # it every file naming `AssayHud` fails to parse. That is exactly how the
      # compile check below passed on my machine, where `.godot/` already existed,
      # and failed on a fresh runner naming 16 files.
      - name: Import the client project
        working-directory: sim-game/client
        run: |
          GODOT="$GITHUB_WORKSPACE/sim-game/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          # THE FIRST IMPORT OF A PROJECT WITH A GDEXTENSION CRASHES ON EXIT,
          # and it is Godot's crash, not ours. The backtrace is Main::cleanup ->
          # CallQueue::flush -> EditorHelp::_gen_extensions_docs ->
          # DocTools::generate -> signal 11, i.e. the editor generating docs for
          # extension classes while shutting down -- long after the import work
          # itself finished. Measured both on this runner (run 36943152626) and
          # locally on 4.6.1, where deleting `.godot/` reproduces it every time
          # and the cache it leaves behind is complete.
          #
          # SO THE RETRY IS THE GATE, not a `|| true` that swallows everything:
          # the first run is allowed to die, the SECOND MUST EXIT 0 (measured:
          # it does, in 2s, because the cache is already there). The two export
          # jobs below do the same and say less.
          "$GODOT" --headless --import || "$GODOT" --headless --import
          grep -q 'sim.gdextension' .godot/extension_list.cfg
      # EVERY .gd FILE COMPILES, INCLUDING THE ONES NOTHING INSTANTIATES. The
      # suite below is a strong guard for loaded code and no guard at all for a
      # probe in `tools/`, which nobody loads until the moment they need it --
      # and Godot exits 0 on a parse error, so a file that cannot compile at all
      # costs nothing to ship. `project.godot` also makes unreachable code and
      # discarded expressions errors, so this gates those too. ~20s.
      - name: Every GDScript file compiles
        working-directory: sim-game/client
        run: |
          GODOT="$GITHUB_WORKSPACE/sim-game/godot/Godot_v${GODOT_VERSION}_linux.x86_64" \
            tools/check_every_script.sh
      # THE THEME IS GENERATED AND COMMITTED, AND UNTIL NOW NOTHING CHECKED THAT
      # THE TWO AGREE (ASSA-228). `project.godot` names `theme/assay.tres` as
      # the project theme, so it reaches every Control in the game; the file
      # that DESCRIBES it is `tools/build_theme.gd`, which CI never ran.
      #
      # The dangerous direction is one-way and silent: edit the generator,
      # forget to regenerate, and the game keeps shipping the old theme while
      # the reviewed source says something else. The reverse is already caught,
      # because the suite measures contrast on real controls.
      #
      # IT MATTERS MORE THAN A STALE ASSET USUALLY WOULD, because that generator
      # is the only thing in the repo that can FAIL a look: it refuses to write
      # a theme whose own text misses 4.5:1. A refusal that never runs in CI
      # guards nothing. This is the arrangement the art sheets already have
      # ("A review sheet still matches the art it drew") and the one
      # `sim-game/CLAUDE.md` states for generated assets: change the script,
      # rebuild, and a modified file you did not touch is a finding.
      #
      # Byte-reproducible: verified on 7f4efb0 and on e834193, same md5 before
      # and after a rebuild, so this fails only on real drift.
      - name: The committed theme is the one its generator writes
        working-directory: sim-game/client
        run: |
          GODOT="$GITHUB_WORKSPACE/sim-game/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          "$GODOT" --headless --path . --script res://tools/build_theme.gd | tee theme.log
          # GODOT EXITS 0 ON ALMOST ANYTHING, including a refusal: the generator
          # prints THEME BUILT last and only on success, so that line is the
          # verdict and the exit code is not.
          grep -q '^THEME BUILT' theme.log
          git diff --exit-code -- theme/assay.tres \
            || { echo "::error::theme/assay.tres is not what build_theme.gd writes -- run it and commit the result"; exit 1; }
      - name: Client suite
        working-directory: sim-game/client
        run: |
          GODOT="$GITHUB_WORKSPACE/sim-game/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          "$GODOT" --headless --script tests/run_tests.gd | tee suite.log
          # GODOT EXITS 0 ON A COMPILE ERROR, so the count the runner prints is
          # the verdict and the exit code is not. Grep the file, never a pipe.
          grep -qE '^[0-9]+ passed, 0 failed' suite.log
      # THE WHOLE DEMO LOOP, PRESSED THROUGH THE SCREEN'S OWN BUTTONS. ASSA-37's
      # claim is REACHABILITY, and the only thing that plays it end to end is
      # `tools/button_session.gd`; until now nothing ran it, so #81 broke every
      # pack-row press (child 0 stopped being the sentence) and CI stayed green
      # (ASSA-62). The suite has its own row finder, so it cannot witness the
      # tool's.
      #
      # MEASURED, 1.1s on my Mac: offline mode has no clock and no socket -- this
      # script writes the tick bundles itself -- so it is deterministic and ends
      # on the same world hash every run, not a timing-sensitive integration test.
      # The marker is printed LAST and only on success, which is the only thing a
      # grep can trust when Godot exits 0 on a failed script.
      #
      # THREE RUNS, AND THE GREP IS ON THE SUFFIX (ASSA-140). One run greped for
      # `^BUTTON SESSION OK`, which the loop printed whether it ended with a
      # machine mining, a machine standing there stopped, or a design that came
      # apart -- so a demo that paid off in 0% of worlds read green for weeks.
      # Each run below names the outcome it requires and the loop now plants the
      # drill the SIM says does that job, so neither outcome is the seed's choice.
      #
      # WHY THESE SEEDS, each catching something the others cannot:
      #  - 777042 is where the drill used to land OFF the deposit and stand there
      #    idle (the Game Director's measurement). Reverting that fix fails here
      #    and is INVISIBLE on 14247, where the old spot happens to hold ore.
      #  - 14247 is the pinned showcase seed: every window shot, every picture the
      #    board has seen, and the bar Wren set -- a drill standing AND mining.
      #  - 14247 again for the break, because it is one of the 44.9% of worlds
      #    that hold an over-budget design at all; on 777042 nothing the frame
      #    takes breaks, and that run honestly reports NO SUCH DESIGN.
      - name: The demo loop is reachable through the buttons
        working-directory: sim-game/client
        run: |
          GODOT="$GITHUB_WORKSPACE/sim-game/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          "$GODOT" --headless --path . --script res://tools/button_session.gd \
            -- offline 777042 0 showcase | tee session-deposit.log
          grep -q '^BUTTON SESSION OK · MACHINE MINING' session-deposit.log
          "$GODOT" --headless --path . --script res://tools/button_session.gd \
            -- offline 14247 0 showcase | tee session-showcase.log
          grep -q '^BUTTON SESSION OK · MACHINE MINING' session-showcase.log
          "$GODOT" --headless --path . --script res://tools/button_session.gd \
            -- offline 14247 0 break | tee session-break.log
          grep -q '^BUTTON SESSION OK · DESIGN BROKE' session-break.log
      # THE HUD'S OWN PROBE, IN A GATE FOR THE FIRST TIME (ASSA-238). ASSA-116's
      # box 6 is about the HUD panels, and the only instrument that reads them is
      # `client/tools/hud_probe.gd`, which until this step had ZERO references in
      # this file: every number it has ever produced came off one Mac, by hand. A
      # probe that runs when somebody remembers it is not a guard, it is a tool.
      # The sweep behind the item is worse than one probe -- 3 of 45 scripts in
      # `client/tools/` are run by any gate, and 32 of them print an `X OK`
      # marker nothing greps.
      #
      # WHY A SCRIPT AND NOT TEN LINES HERE. `tools/hud_in_a_gate.sh` is the same
      # code a developer runs, which is how the mutation below could be proved
      # locally before costing a runner anything. It starts the relay on a
      # KERNEL-ASSIGNED port (`--port 0`, printed as `LISTENING <addr>:<port>`,
      # so it cannot collide with a parallel job, a leftover process or anyone's
      # 7777), kills it from an EXIT trap that escalates TERM -> KILL and says if
      # it had to force it, and ends a relay that never comes up with a sentence
      # about THE RELAY instead of a HUD assertion. Its header carries the rest.
      #
      # WHAT IT CATCHES THAT THE 393-TEST SUITE ABOVE CANNOT, measured and not
      # asserted. Hiding the species name on rock nothing can hand-mine --
      # `deposit 0 · a rock · 919 ore left` -- leaves that suite at `393 passed,
      # 0 failed`, because every `_tile_with` fixture in `test_hud.gd` has
      # `hand_minable: true`. This step goes red on it. The suite's fixtures are
      # a hand-made copy of what the binding sends; this is the only thing in CI
      # that reads the dictionaries a real world actually produces.
      #
      # AND THE PROBE WAS WEAKER THAN IT READ, found by that same mutation: its
      # species check joined the WHOLE tile readout, and on unmineable rock the
      # sim's own reach sentence names the species, so the mutation passed it too.
      # It now asserts the name on the deposit's own line, for every deposit with
      # ore in it (13 on seed 14247) rather than the first one the seed happens
      # to hand it.
      #
      # Seed 14247 is the pinned showcase seed, `--fresh` so the world is at tick
      # 0 and every sheet is still rough -- the band check has something to bite.
      #
      # COST, since the item asked for it: ubuntu-latest, inside this job, no
      # macOS runner and no 10x. The relay crate is the only thing it compiles --
      # `sim` and `sim-net` are already release-built above for the binding.
      - name: The HUD reads a real world, through a relay this job started
        run: |
          cargo build -p sim-relay --release
          GODOT="$GITHUB_WORKSPACE/sim-game/godot/Godot_v${GODOT_VERSION}_linux.x86_64" \
            tools/hud_in_a_gate.sh 14247 25
      # THE LETTER ON A MAP DISC IS READABLE. Runs the client and scores what
      # `AssayHud.glyph_color` actually returned for all 600 species x purity
      # states (ASSA-39/44), rather than reimplementing the rule -- computing
      # both ratios here and asserting the better one is better would pass by
      # construction.
      #
      # OPTIMALITY IS DELIBERATELY DOUBLE-COVERED and I am saying so rather than
      # implying this step is load-bearing for it: `test_hud.gd` in the suite
      # above already asserts the same property in GDScript. Two independent
      # implementations in two languages agreeing is worth a few seconds on a
      # runner that already has Godot warm, but it is not why this step exists.
      #
      # WHAT ONLY THIS STEP GUARDS is the TINT TABLE, which is the art's problem
      # and mine: the worst letter available on any disc -- max(dark, light),
      # the ceiling of any possible picker -- must clear WCAG AA for normal text
      # (4.5, not large text's 3.0; `glyph_size` draws down to 10px). Today that
      # is 4.5152 at #FF80BF purity 24, a margin of ONE PART IN 300. If a tint
      # ever drops it under, no picking rule can rescue the glyph and the fix is
      # a design conversation about the tint. Nothing else in CI would notice.
      #
      # Exit codes are three-valued on purpose: 0 green, 1 the client or the
      # table is wrong, 2 NO VERDICT (engine unreachable) -- which fails the job
      # rather than passing quietly.
      - name: The letter on a map disc is readable
        run: |
          GODOT="$GITHUB_WORKSPACE/sim-game/godot/Godot_v${GODOT_VERSION}_linux.x86_64" \
            python3 art/check_glyph_contrast.py
      # A PACK ICON IS DRAWN AT A SCALE SOMEONE CHOSE (ASSA-65). `custom_minimum_size`
      # is a floor, so the icon's rect used to be 32 x WHATEVER THE ROW WAS and an ore
      # item came out at 15/32 -- 30 of 64 source columns surviving, unevenly spaced.
      # Nobody picked that; it fell out of how many buttons the row afforded.
      #
      # It drives Cove's `art/pack_icon_layout.gd`, which instantiates the real scene
      # and prints what the engine LAID OUT, rather than reading the two properties
      # `main.gd` sets and checking they are the two values `main.gd` sets. The second
      # would pass by construction and would survive Godot changing its layout rules.
      #
      # Measured: red at 0.46875 on the code before #92, green at 1/2 and 1/4 after.
      # Same three-valued exits as the glyph check -- and it really does use the 2: if
      # the measured rows ever stop affording different verbs there is nothing left
      # for the scale to be invariant against, and it says so instead of passing.
      - name: A pack icon is drawn at a scale someone chose
        run: |
          GODOT="$GITHUB_WORKSPACE/sim-game/godot/Godot_v${GODOT_VERSION}_linux.x86_64" \
            python3 art/check_pack_icon_scale.py
      # THE SLOT PLATE IS STILL THE GROUND'S OWN COLOUR (ASSA-71, Maren's ruling).
      # The plate is not "a colour that tested well": it is ground.png's median, so a
      # stack in the pack row and a rock on the map are the same object. A hex that
      # merely equals today's ground passes every contrast ratio and is wrong the
      # morning the ground is re-rendered, so nothing in that check names a colour.
      #
      # It holds three sources identical -- the SHEET (median recomputed now), the
      # PIPELINE (what the last build wrote to ui_theme.json) and the ENGINE (the
      # StyleBoxFlat the client really painted, read out of the live scene). Each pair
      # catches its own failure: a ground re-rendered without a rebuild, and a client
      # that stopped reading the file. It also fails if any GDScript spells the colour
      # as a literal, which is the constraint the ruling states.
      #
      # Measured by mutation, because a check that has only ever been green has only
      # ever been an opinion: editing the shipped hex, typing Color8(136,152,108) into
      # sprites.gd, and pointing the client's path at a missing file each turn it red.
      - name: The pack icon's slot plate is the ground's own colour
        run: |
          GODOT="$GITHUB_WORKSPACE/sim-game/godot/Godot_v${GODOT_VERSION}_linux.x86_64" \
            python3 art/check_pack_icon_plate.py
      # A PACK ICON MUST STILL CARRY THE KIND ON ITS OWN (ASSA-111, guarding ASSA-101).
      # Maren's split took every MAKE verb off the pack row, so four consecutive part
      # rows now carry one identical word and the icon is one of only two carriers of
      # what a row holds. She ruled today's separation acceptable; nothing guarded it.
      #
      # It asserts the PLAYER-FACING property and nothing else -- no pair of kinds is
      # close on BOTH silhouette (IoU of the drawn body masks) and interior colour
      # (dE76 over their overlap). Her ruling 2 is the reason it may not be written on
      # positions: three part/part pairs separate at IoU 0.000 only because rig.py puts
      # head on the far side of the join, and the correct fix for that (loose parts
      # drawn by items.py) must be able to land green.
      #
      # TWO CONTROLS RUN INSIDE IT EVERY TIME, so it cannot be green by construction:
      # every kind against itself must come back IoU 1.000 / dE 0.00, and one kind's
      # icon substituted for another's must be CAUGHT. Either control failing exits 2.
      # Proved red end to end as well, exit 1, against a sprite tree with hopper.png
      # replaced by handle.png.
      - name: A pack icon still carries the kind on its own
        run: |
          GODOT="$GITHUB_WORKSPACE/sim-game/godot/Godot_v${GODOT_VERSION}_linux.x86_64" \
            python3 art/check_icon_kinds.py
      # A LOOSE PART IS AS MUCH OF AN OBJECT AS AN ORE CHUNK (ASSA-112). The pack slot
      # is portrait (32x48) and a part's authoring frame is landscape (128x102, because
      # it holds an assembly JOIN), so a part fitted into a slot filled 4.5-13.3% of it
      # where every item fills 24.7-35.2%. Maren ruled the fix: parts get rows on the
      # ITEMS sheet, drawn as loose things, and the assembly sheets are untouched.
      #
      # TWO PROPERTIES, both hers: no row smaller in its slot than the SMALLEST ITEM --
      # a floor read from the ore row in the same run, never a number in the check --
      # and ASSA-111's conjunction on the new rows, using ASSA-111's own `verdict`
      # imported rather than copied, because a loose drawing has no join to borrow its
      # separation from.
      #
      # IT MEASURES THE SHEET, NOT THE CLIENT, and says so: `sprites.gd` still points
      # part rows at the assembly sheets, and that switch is its own item. The day it
      # lands, `check_icon_kinds.py` measures these same pixels through the engine.
      #
      # TWO CONTROLS RUN INSIDE IT EVERY TIME: every kind is itself at IoU 1.000 / dE
      # 0.00 and the rows are not one picture, and on a copy of the real answer a
      # substituted icon must be caught AND a kind drawn at half size must fall under
      # the floor. Either failing exits 2. Proved red end to end too: `--shrink hopper`
      # exits 1.
      - name: A loose part fills a pack slot like an item
        run: |
          GODOT="$GITHUB_WORKSPACE/sim-game/godot/Godot_v${GODOT_VERSION}_linux.x86_64" \
            python3 art/check_items_kinds.py
      # THE REVIEW SHEET SAYS WHAT THE CLIENT SAYS (ASSA-132, guarding ASSA-103).
      # `assets/review/pack_icons.png` labelled head, handle, frame and hopper all
      # "Frame" for days after the client started saying "Mount" on two of them. The
      # pipeline was not wrong -- every word in that sheet came from the engine's own
      # buttons. The sheet was simply drawn before ASSA-103 and never redrawn: #157
      # regenerated `pack_rows.png` from a fresh layout and left this one alone.
      #
      # A guard inside the generator cannot catch the generator not being RUN, so the
      # generator stamps the words it drew into the PNG and this asks the live engine
      # for the same words and compares. It also checks the word itself against the
      # catalogue's `is_frame`, by button POSITION rather than by reading the text --
      # "Frame" starting with the word Frame is a fact about English (ASSA-99).
      #
      # Anti-vacuity: it needs one frame kind AND one mounted kind among the rows, or
      # "the word follows the catalogue" is one word everywhere and cannot fail; that
      # exits 2. Proved red three ways: the pre-stamp sheet (no stamp), a stamp
      # carrying the four old "Frame" words (names head and hopper, which is Nerite's
      # finding reproduced), and `is_frame := true` in `hud.gd` (the client defect,
      # which turns both claims red at once).
      - name: The pack review sheet says what the client says
        run: |
          GODOT="$GITHUB_WORKSPACE/sim-game/godot/Godot_v${GODOT_VERSION}_linux.x86_64" \
            python3 art/check_pack_row_word.py
      # A REVIEW SHEET IS STILL A PICTURE OF THE CLIENT IT DREW (ASSA-151).
      #
      # `check_review_sources.py` above digests the shipped ART a sheet composited, which
      # is the whole answer for the six sheets that are pictures of sprites. Two are
      # pictures of a CLIENT PANEL: `pack_rows.png` and `pack_icons.png` are drawn from
      # `pack_icon_layout.gd`'s answer -- row heights, icon scales, verbs, plate colours,
      # the panel's width -- and none of that is a file, so the sources stamp named
      # `items.png` and `ui_theme.json` and could not go red when a row's scale moved.
      #
      # IT WAS NOT BROKEN WHEN IT WAS FOUND, which is the point. ASSA-121 moved every pack
      # row to scale 0.5 and both sheets were current, because the person who moved it
      # remembered to redraw them. Maren's ruling 3 on ASSA-144: a rule that depends on
      # remembering is a rule that fails on the wake-up somebody is tired.
      #
      # The generators stamp the canonical digest of the layout they were handed; this asks
      # the live engine for the layout today and compares. Two anti-vacuity guards, both
      # exit 2: the stamping cannot have been removed wholesale, and the two panel sheets
      # must carry a stamp whatever their scripts say -- a mutation proved the measured
      # half alone goes green when a generator is reverted AND its sheet redrawn.
      #
      # Lever: REVIEW_LAYOUT_FAKE_MOVE=1 must turn it red naming both sheets. Proved red
      # for real too, by moving `ICON_PX` 32 -> 34 in the client with the sheets left
      # alone, and restoring it.
      #
      # A SECOND PROBE SINCE ASSA-173, AND IT IS WHY THIS STEP GOT SLOWER. `design_rows.png`
      # was the last sheet that could declare nothing; it now carries a layout stamp, which
      # means this step re-asks `art/design_row_layout.gd` as well. That one costs THREE
      # Godot runs rather than one -- two offline demo runs (the bench shows one design per
      # run, so SAFE and UNCERTAIN are two runs of the same seed) and the probe over the
      # merge. The whole chain is `art/design_row_dump.py`, which the generator also draws
      # from, so the digest here and the digest on the sheet come from one piece of code.
      #
      # Everything it needs is already standing in this job: the binding is built above and
      # `button_session.gd` is the same script the demo-loop step runs. The lever covers it
      # too -- FAKE_MOVE reddens FOUR sheets now, not three.
      - name: A review sheet is still a picture of the client it drew
        run: |
          GODOT="$GITHUB_WORKSPACE/sim-game/godot/Godot_v${GODOT_VERSION}_linux.x86_64" \
            python3 art/check_review_layout.py

  macos:
    name: macOS bundle
    needs: test
    runs-on: macos-latest
    # THE STEP CAPS BELOW ONLY GUARD THE STEP THEY ARE ON (ASSA-51 follow-up).
    # The selfcheck is capped at 2 minutes because that is the step that hung,
    # but the export itself, the Godot download and a cold cargo build have no
    # cap at all, so any of them hanging still runs to the 360-minute default
    # -- on macOS, which bills at 10x on a personal account. Nothing in this
    # job honestly takes 45 minutes, so anything past it is a defect.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim-game
      - name: Build for both Mac chips
        run: >
          cargo build --release -p sim-cli -p sim-relay -p sim-godot
          --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Bundle (universal binaries)
        run: |
          mkdir -p bundle/assay-macos
          for b in sim-cli sim-relay; do
            lipo -create \
              target/aarch64-apple-darwin/release/$b \
              target/x86_64-apple-darwin/release/$b \
              -output bundle/assay-macos/$b
            codesign -s - --force bundle/assay-macos/$b
          done
          cp packaging/README-macos.txt bundle/assay-macos/README.txt
          {
            echo "Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d)"
            echo "Godot client exported with $GODOT_VERSION"
          } > bundle/assay-macos/VERSION.txt
      - name: Godot and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}_macos.universal.zip"
          unzip -q godot.zip -d godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q templates.tpz -d templates
          dest="$HOME/Library/Application Support/Godot/export_templates"
          mkdir -p "$dest"
          mv templates/templates "$dest/$GODOT_TEMPLATE_DIR"
      # THE SIM, UNIVERSAL, WHERE THE CLIENT LOADS IT FROM. A `TickBundle`
      # carries inputs, so the world at tick N exists only once something runs
      # `sim::step`; that something is this library, never GDScript.
      #
      # Universal because the .app is (`binary_format/architecture="universal"`
      # in export_presets.cfg). This runner is Apple Silicon, so an arm64-only
      # library would load here, pass every check below, and fail on the first
      # tester with an Intel Mac.
      - name: The sim binding, for both Mac chips
        run: |
          mkdir -p client/bin
          lipo -create \
            target/aarch64-apple-darwin/release/libsim_godot.dylib \
            target/x86_64-apple-darwin/release/libsim_godot.dylib \
            -output client/bin/libsim_godot.dylib
          lipo -info client/bin/libsim_godot.dylib
      - name: Export the Godot client
        working-directory: sim-game/client
        run: |
          GODOT="$GITHUB_WORKSPACE/sim-game/godot/Godot.app/Contents/MacOS/Godot"
          # Said plainly here because the alternative is Godot aborting mid-export
          # with a C++ stack trace and no reason (exit 134, measured).
          test -f bin/libsim_godot.dylib \
            || { echo "no bin/libsim_godot.dylib: the step above did not run"; exit 1; }
          # First import crashes on exit in Godot's own doc generation; the
          # second must not. The long version is in the test job above.
          "$GODOT" --headless --import || "$GODOT" --headless --import
          grep -q 'sim.gdextension' .godot/extension_list.cfg
          # Godot DOES NOT CREATE THE OUTPUT FOLDER -- it fails with "Target
          # folder does not exist or is inaccessible" (measured 2026-10-01).
          mkdir -p ../bundle/assay-macos
          "$GODOT" --headless --export-release macOS ../bundle/assay-macos/Assay.app
          # Ad-hoc, same as the Rust binaries above: an unsigned universal .app
          # will not open on an Apple Silicon Mac at all. Not notarised, so the
          # first open is still right-click → Open.
          codesign -s - --force --deep ../bundle/assay-macos/Assay.app
          codesign -dv ../bundle/assay-macos/Assay.app
          # The exporter copies a .gdextension's libraries into the bundle
          # (Contents/Frameworks, measured locally). Said out loud because the
          # selfcheck below would otherwise be the only thing standing between a
          # silently library-less .app and a tester.
          find ../bundle/assay-macos/Assay.app -name 'libsim_godot.dylib' | grep .
      - name: The exported client runs
        # A HANG IS A FAILURE AND MUST LOOK LIKE ONE. The self-check takes under a
        # second; before ASSA-51 this step sat for 45 MINUTES on every merge,
        # because a GUI binary whose main script failed to parse never reaches the
        # `quit()` in `_ready` and just waits on the platform event loop. Three
        # merges' worth of runs did that, on macOS at 10x minutes, and the job
        # would have run to the 6-hour default. Two minutes is ~100x the honest
        # cost of this step, so anything over it is a defect and not a slow runner.
        timeout-minutes: 2
        run: |
          # AN EXPORT CAN SUCCEED AND SHIP A PACK THAT WILL NOT LOAD, and the
          # exit code of a missing or broken binary can still be 0 (measured),
          # so the marker file this writes LAST is the verdict. It now also
          # covers the sim binding: the check steps a small world through the
          # library and through `sim::step` directly and compares the two
          # hashes, so a library that shipped but will not load is caught here
          # rather than by the first player who tries to see tick N.
          rm -f selfcheck.txt
          bundle/assay-macos/Assay.app/Contents/MacOS/Assay \
            --headless -- --selfcheck "$PWD/selfcheck.txt"
          cat selfcheck.txt
          grep -qx 'CLIENT SELFCHECK OK' selfcheck.txt
          rm selfcheck.txt
      # ASSA-40: the rules this bundle plays, in the run log, so a tester's
      # zip can be paired with a running relay by reading rather than by
      # `lsof` and a binary mtime. The relay prints the same line on start
      # and refuses a peer that disagrees.
      - name: Rules identity
        run: |
          id=$(bundle/assay-macos/sim-cli --plain </dev/null | sed -n 's/^rules \([0-9a-f]*\).*/\1/p')
          test -n "$id" || { echo "sim-cli did not print a rules identity"; exit 1; }
          # In VERSION.txt as well as the log: the log is for whoever hosts,
          # the file travels with the zip for whoever downloads it.
          echo "Game rules $id (a host on other rules will refuse this build)" \
            >> bundle/assay-macos/VERSION.txt
          echo "assay-macos rules identity: $id"
          echo "assay-macos rules identity: \`$id\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Zip
        run: cd bundle && ditto -c -k --keepParent assay-macos assay-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: assay-macos
          path: sim-game/bundle/assay-macos.zip
          if-no-files-found: error
      - name: The exported client measures its own motion, out of the zip (ASSA-211)
        # **OUT OF THE ZIP, NOT OUT OF THE BUILD DIRECTORY, and the difference is
        # the item's own wording.** The acceptance says "from a CI zip": the bytes a
        # tester actually double-clicks have been through `ditto` and back, and on
        # macOS an archiver that drops the executable bit produces an .app that
        # cannot start at all. Running the pre-zip bundle would never see that.
        #
        # **THIS IS THE ZIP'S OWN BINARY MEASURING ITSELF, which nothing could do
        # before this item.** Every motion number the studio had quoted came from a
        # Godot editor binary on a CHECKOUT: `tools/*` is excluded from the pack, and
        # lifting that is not enough because `--script` is an X-flag the official
        # release templates DROP (measured, with a bogus script path as the control).
        # `-- --motion-probe <file>` is read by `scripts/main.gd`, which IS packed.
        #
        # **THE ASSERTION IS `EXPORTED (template)` AND THAT IS THE WHOLE POINT.** A
        # report produced by the project says "the project (editor binary)" instead,
        # and would prove nothing this item is about.
        #
        # **IT IS DELIBERATELY NOT AN ASSERTION ABOUT MOTION.** A runner with no
        # window server legitimately refuses and the report says so in its own words;
        # that still proves the door. What cannot pass is the client IGNORING the
        # flag -- then there is no file at all, which is precisely how `--script`
        # failed, so the missing file is the control.
        #
        # After the upload above on purpose: a red probe must not cost us the zip to
        # look at.
        timeout-minutes: 5
        run: |
          rm -rf unzipped motion.txt
          ditto -x -k bundle/assay-macos.zip unzipped
          app=unzipped/assay-macos/Assay.app/Contents/MacOS/Assay
          test -x "$app" || { echo "the zip's Assay is not executable: $app"; exit 1; }
          code=0
          "$app" -- --motion-probe "$PWD/motion.txt" 6 || code=$?
          echo "the zip's own client exited $code"
          test -f motion.txt || {
            echo "the zip's client wrote no report: the argument was not honoured"; exit 1; }
          cat motion.txt
          grep -q 'MACHINE:' motion.txt
          grep -q 'EXPORTED (template)' motion.txt \
            || { echo "the report did not come from an exported build"; exit 1; }
          rm -rf unzipped motion.txt

  windows:
    name: Windows bundle
    needs: test
    runs-on: windows-latest
    # Same reason as the macOS job; cheaper minutes, same six-hour tail.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim-game
      # The sim binding is built in the SAME invocation, with the same flags, on
      # purpose: it ships to players too, so it must not be the one file in the
      # zip that needs a VC++ redistributable. Separate invocations with
      # different RUSTFLAGS would also recompile the whole dependency graph.
      - name: Build (static C runtime, no VC++ redistributable needed)
        run: cargo build --release -p sim-cli -p sim-relay -p sim-godot
        env:
          RUSTFLAGS: -C target-feature=+crt-static
      - name: Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bundle/assay-windows | Out-Null
          Copy-Item target/release/sim-cli.exe, target/release/sim-relay.exe bundle/assay-windows/
          Copy-Item packaging/README-windows.txt bundle/assay-windows/README.txt
          @(
            "Built from $($env:GITHUB_SHA.Substring(0,7)) on $(Get-Date -Format yyyy-MM-dd -AsUTC)"
            "Godot client exported with $($env:GODOT_VERSION)"
          ) | Set-Content bundle/assay-windows/VERSION.txt
      - name: Godot and export templates
        shell: pwsh
        run: |
          $base = "https://github.com/godotengine/godot/releases/download/$($env:GODOT_VERSION)"
          Invoke-WebRequest "$base/Godot_v$($env:GODOT_VERSION)_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
          # Expand-Archive only takes a .zip name, and a .tpz is a zip.
          Invoke-WebRequest "$base/Godot_v$($env:GODOT_VERSION)_export_templates.tpz" -OutFile templates.zip
          Expand-Archive templates.zip -DestinationPath templates
          $dest = "$($env:APPDATA)\Godot\export_templates"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Move-Item templates/templates "$dest\$($env:GODOT_TEMPLATE_DIR)"
      - name: Export the Godot client
        shell: pwsh
        working-directory: sim-game/client
        run: |
          # THE _console WRAPPER, NOT THE PLAIN .exe. The plain Windows editor
          # is a GUI-subsystem binary: launched from a shell it prints its
          # banner, detaches and returns 0 immediately, so the export never
          # happens and nothing reports it. That is how this job first failed
          # (run 36925261824): the export "passed" in 0.5s and the error
          # surfaced two steps later as a missing file. The wrapper is what
          # makes every exit code below mean something.
          $godot = "$($env:GITHUB_WORKSPACE)\sim-game\godot\Godot_v$($env:GODOT_VERSION)_win64_console.exe"
          # THE SIM BINDING, WHERE sim.gdextension LOOKS FOR IT. A TickBundle
          # carries inputs, so the world at tick N exists only once something
          # runs sim::step, and that something is this DLL, never GDScript.
          # Godot ABORTS mid-export (exit 134, a C++ stack trace, no reason)
          # when a .gdextension names a library that is not there, so say it
          # here instead.
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item ../target/release/sim_godot.dll bin/
          if (-not (Test-Path bin/sim_godot.dll)) { throw "no bin/sim_godot.dll to export with" }
          # First import crashes on exit in Godot's own doc generation for
          # extension classes; the second must not. The long version is in the
          # test job above.
          & $godot --headless --import
          if ($LASTEXITCODE -ne 0) {
            Write-Host "first --import exited $LASTEXITCODE; retrying once"
            & $godot --headless --import
            if ($LASTEXITCODE -ne 0) { throw "godot --import exited $LASTEXITCODE twice" }
          }
          if (-not (Select-String -Path .godot/extension_list.cfg `
              -Pattern 'sim.gdextension' -Quiet)) {
            throw "the import registered no sim.gdextension"
          }
          # Godot does not create the output folder (measured on macOS; same
          # exporter). The preset embeds the pack, so this is one .exe.
          New-Item -ItemType Directory -Force ../bundle/assay-windows | Out-Null
          & $godot --headless --export-release "Windows Desktop" ../bundle/assay-windows/Assay.exe
          if ($LASTEXITCODE -ne 0) { throw "the export exited $LASTEXITCODE" }
          # The export step proves its own output rather than leaving it to the
          # next one.
          if (-not (Test-Path ../bundle/assay-windows/Assay.exe)) {
            Get-ChildItem ../bundle/assay-windows
            throw "the export reported success but wrote no Assay.exe"
          }
          # The pack is embedded in the .exe, but a GDExtension library cannot be
          # -- the OS loads it as a file. Where the exporter puts it is its
          # business; that it is IN the zip is ours.
          $lib = Get-ChildItem -Recurse ../bundle/assay-windows -Filter sim_godot.dll
          if (-not $lib) {
            Get-ChildItem -Recurse ../bundle/assay-windows | Select-Object -Expand FullName
            throw "the export shipped no sim_godot.dll, so the client cannot run the sim"
          }
          $lib.FullName
      - name: The exported client runs
        # See the macOS job's copy of this step: a hang here is a parse error in a
        # shipped script, not a slow runner (ASSA-51).
        timeout-minutes: 2
        shell: pwsh
        run: |
          # The only check the Windows build gets: nobody at the studio has a
          # Windows machine, but the runner can run what it just built. The
          # marker file is the verdict, for the reasons in selfcheck.gd. It is
          # also the only proof that the sim binding loads on Windows at all.
          $marker = Join-Path $pwd 'selfcheck.txt'
          Remove-Item $marker -ErrorAction SilentlyContinue
          # START-PROCESS IGNORES POWERSHELL'S CURRENT DIRECTORY: it resolves a
          # relative path against the process's own and fails with "The system
          # cannot find the file specified" (measured, run 36925261824). So:
          # absolute, via Resolve-Path, which also throws if it is not there.
          $exe = (Resolve-Path bundle/assay-windows/Assay.exe).Path
          # The exported client is GUI-subsystem too, hence -Wait.
          $p = Start-Process -FilePath $exe `
            -ArgumentList '--headless', '--', '--selfcheck', $marker `
            -Wait -PassThru -NoNewWindow
          if (-not (Test-Path $marker)) { throw "the exported client wrote no marker" }
          Get-Content $marker
          if ($p.ExitCode -ne 0) { throw "the exported client exited $($p.ExitCode)" }
          if (-not (Select-String -Path $marker -Pattern '^CLIENT SELFCHECK OK$' -Quiet)) {
            throw "the exported client failed its self-check"
          }
          Remove-Item $marker
      # ASSA-40, same as the macOS job. The two identities from one commit
      # must MATCH: the fingerprint drops carriage returns precisely so a
      # CRLF checkout here agrees with the Mac, and a tester pairing a
      # Windows zip to a Mac-hosted relay depends on it.
      - name: Rules identity
        shell: pwsh
        run: |
          $out = $null | bundle/assay-windows/sim-cli.exe --plain
          $id = ($out | Select-String -Pattern '^rules ([0-9a-f]+)').Matches.Groups[1].Value
          if (-not $id) { throw "sim-cli did not print a rules identity: $out" }
          Add-Content bundle/assay-windows/VERSION.txt `
            "Game rules $id (a host on other rules will refuse this build)"
          Write-Output "assay-windows rules identity: $id"
          Add-Content $env:GITHUB_STEP_SUMMARY "assay-windows rules identity: ``$id``"
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path bundle/assay-windows -DestinationPath bundle/assay-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: assay-windows
          path: sim-game/bundle/assay-windows.zip
          if-no-files-found: error
      - name: The exported client measures its own motion, out of the zip (ASSA-211)
        # See the macOS job's copy for why it is the extracted zip, why
        # `EXPORTED (template)` is the assertion and why a missing file is the
        # control.
        #
        # **AND THIS IS THE ONE THAT MATTERS MOST, because the complaint was about a
        # PC.** `windows-motion-probe` already measures a window on this runner, but
        # it measures the PROJECT with an editor binary. This measures the `Assay.exe`
        # a player unzips, which is the only artefact anybody actually runs.
        timeout-minutes: 5
        shell: pwsh
        run: |
          $report = Join-Path $pwd 'motion.txt'
          Remove-Item $report, unzipped -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path bundle/assay-windows.zip -DestinationPath unzipped
          # Absolute, via Resolve-Path, for the Start-Process reason the selfcheck
          # step above gives.
          $exe = (Resolve-Path unzipped/assay-windows/Assay.exe).Path
          $p = Start-Process -FilePath $exe `
            -ArgumentList '--', '--motion-probe', $report, '6' `
            -Wait -PassThru -NoNewWindow
          Write-Output "the zip's own client exited $($p.ExitCode)"
          if (-not (Test-Path $report)) {
            throw "the zip's client wrote no report: the argument was not honoured"
          }
          Get-Content $report
          if (-not (Select-String -Path $report -Pattern 'MACHINE:' -Quiet)) {
            throw "the report carries no MACHINE line, so no number in it names its hardware"
          }
          if (-not (Select-String -Path $report -Pattern 'EXPORTED \(template\)' -Quiet)) {
            throw "the report did not come from an exported build"
          }
          Remove-Item $report; Remove-Item unzipped -Recurse -Force

  windows-motion-probe:
    # **HOW FAST THE BODY IS DRAWN ON A WINDOWS BOX** (ASSA-205). Every motion
    # number this studio owns was taken on the one Mac; the board's "terrible,
    # very jumpy" verdict is about `assay-windows` on their PC. This job is the
    # only Windows machine we can reach.
    #
    # **IT IS NOT THE BOARD'S PC AND IT IS NOT THE EXPORTED ZIP, AND NEITHER GAP
    # IS HIDDEN: both are printed on every number it produces.**
    #
    # WHY THE PROBE RUNS THROUGH THE GODOT BINARY AND NOT THROUGH `Assay.exe`,
    # measured on 4.6.1 before this job was written, not assumed:
    #   1. Both export presets carry `exclude_filter="tests/*, tools/*"`, so
    #      `res://tools/motion_speed_probe.gd` is not inside the pack players get.
    #   2. Lifting that exclusion is not enough. `--script` is an X-flag in
    #      `godot --help` ("editor builds, and export templates compiled with
    #      disable_path_overrides=false"), and the official 4.6.1 template drops
    #      it: an export carrying the probe, asked to run it, printed its banner
    #      and quit with no error and no probe output -- and a deliberately bogus
    #      `--script res://tools/no_such_probe.gd` behaved identically, which is
    #      the control that says the flag is ignored rather than the file missing.
    # So an exported build cannot be asked to measure itself today. Making it
    # measurable needs an argument the client itself honours, the way
    # `-- --selfcheck <file>` already works; that is a separate item, and it is
    # the only route to a number from the board's own machine.
    name: Windows motion probe (ASSA-205)
    # Deliberately NOT a step in "Windows bundle" and deliberately not
    # `needs: test`: a window that will not open is one of this job's two
    # legitimate results, so it must be incapable of reddening the zip the board
    # downloads, and it needs nothing the ubuntu job spends ten minutes on.
    if: github.event_name == 'workflow_dispatch' && inputs.motion_probe
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim-game
          # The action keys its cache on the job, so without a shared key of its
          # own this job would pay a cold Windows release build every run.
          shared-key: windows-motion-probe
      - name: Build the relay and the binding, with the flags the bundle ships
        # The same invocation and the same RUSTFLAGS as the bundle job above: a
        # pacing number taken against a binding built with different flags is a
        # number about a build nobody downloads. `sim-cli` is not built because
        # the probe never runs it.
        run: cargo build --release -p sim-relay -p sim-godot
        env:
          RUSTFLAGS: -C target-feature=+crt-static
      - name: Godot
        shell: pwsh
        run: |
          # THE _console WRAPPER, for the reason the export step gives: the plain
          # Windows editor is a GUI-subsystem binary that detaches and returns 0,
          # so every exit code below would be meaningless. No export templates
          # here -- this job never exports, it runs the project.
          $base = "https://github.com/godotengine/godot/releases/download/$($env:GODOT_VERSION)"
          Invoke-WebRequest "$base/Godot_v$($env:GODOT_VERSION)_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
      - name: Import, with the binding where sim.gdextension looks for it
        shell: pwsh
        working-directory: sim-game/client
        run: |
          $godot = "$($env:GITHUB_WORKSPACE)\sim-game\godot\Godot_v$($env:GODOT_VERSION)_win64_console.exe"
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item ../target/release/sim_godot.dll bin/
          if (-not (Test-Path bin/sim_godot.dll)) { throw "no bin/sim_godot.dll to run with" }
          # First import crashes on exit in Godot's own doc generation for
          # extension classes; the second must not. Same dance as the test job.
          & $godot --headless --import
          if ($LASTEXITCODE -ne 0) {
            Write-Host "first --import exited $LASTEXITCODE; retrying once"
            & $godot --headless --import
            if ($LASTEXITCODE -ne 0) { throw "godot --import exited $LASTEXITCODE twice" }
          }
          if (-not (Select-String -Path .godot/extension_list.cfg -Pattern 'sim.gdextension' -Quiet)) {
            throw "the import registered no sim.gdextension, so the probe would run no rules"
          }
      - name: The probe, in a real window
        # The step's own ceiling is a backstop, not the mechanism: the probe holds
        # a 180 s run ceiling and a 30 s join deadline of its own (ASSA-182), and
        # each attempt below is additionally watchdogged.
        timeout-minutes: 25
        shell: pwsh
        working-directory: sim-game/client
        env:
          PROBE_SECONDS: ${{ inputs.motion_seconds }}
        run: |
          $godot = "$($env:GITHUB_WORKSPACE)\sim-game\godot\Godot_v$($env:GODOT_VERSION)_win64_console.exe"
          # ABSOLUTE, AND THE CHILD'S WORKING DIRECTORY SAID OUT LOUD. Start-Process
          # resolves relative paths against the process's own directory and not
          # PowerShell's `Set-Location` (measured in run 36925261824, see the
          # bundle job), so a relative `--path .` here would hand the engine a
          # project that is not this one -- and a missing project is a window that
          # never opens, which would have been filed as result (b).
          $proj = (Resolve-Path .).Path
          $out = Join-Path $proj 'probe-out'
          New-Item -ItemType Directory -Force $out | Out-Null
          $seconds = if ($env:PROBE_SECONDS) { $env:PROBE_SECONDS } else { "8" }
          # SEED 14247 IS PINNED BY THE ITEM: it is the demo and solo default, so
          # it is the world the board walked in when they called it jumpy.
          $seed = "14247"
          # **EVERY ATTEMPT IS KEPT, PASSING OR NOT.** Result (b) on ASSA-205 is
          # the verbatim error text, so a driver that cannot open a window is
          # evidence and not noise. A GPU-less runner may well fail the first of
          # these; the order is cheapest first, most emulated last.
          $drivers = @('', 'd3d12', 'opengl3', 'opengl3_angle')
          $won = ''
          foreach ($d in $drivers) {
            $tag = if ($d -eq '') { 'default' } else { $d }
            $log = Join-Path $out "probe-$tag.log"
            Remove-Item $log -ErrorAction SilentlyContinue
            # The label is printed inside the probe's own report, so a number
            # cannot be quoted without the harness it came from.
            # NO SPACES IN THE LABEL: Start-Process joins -ArgumentList with spaces and
            # does not quote, so a spaced label split into "runner," and the probe
            # read it as its mode (run 37277028434 measured nothing). ASSA-205.
            $label = "windows-latest_runner,_run_$($env:GITHUB_RUN_NUMBER),_driver_$tag,_no_GPU,_NOT_the_board's_PC"
            # `--audio-driver Dummy` is the one deviation from the player's own
            # launch and it is here because a runner has no sound device at all.
            # It cannot touch a drawn-rect distribution; a WASAPI driver failing
            # to initialise on an audio-less box could end the run.
            $argv = @('--path', $proj, '--audio-driver', 'Dummy', '--log-file', $log)
            if ($d -ne '') { $argv += @('--rendering-driver', $d) }
            $argv += @('--script', 'res://tools/motion_speed_probe.gd', '--', $seed, $seconds, $label)
            Write-Output "== attempt: $tag"
            $p = Start-Process -FilePath $godot -ArgumentList $argv -PassThru -NoNewWindow -WorkingDirectory $proj `
              -RedirectStandardOutput (Join-Path $out "stdout-$tag.txt") `
              -RedirectStandardError (Join-Path $out "stderr-$tag.txt")
            if (-not $p.WaitForExit(300000)) {
              Write-Output "   attempt $tag did not exit in 300s; killing it"
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              Add-Content $log "ATTEMPT KILLED: no exit in 300s"
            } else {
              Write-Output "   exit $($p.ExitCode)"
            }
            # A KILLED PROBE LEAVES ITS RELAY RUNNING, and the solo relay keeps
            # its save: the next attempt would otherwise join the previous
            # attempt's world and measure a body already standing where it was
            # walking to.
            Get-Process sim-relay -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            if (Test-Path $log) {
              Get-Content $log | ForEach-Object { "   | $_" }
              if (Select-String -Path $log -Pattern 'VERDICT:' -Quiet) { $won = $tag; break }
            } else {
              Write-Output "   | (the engine wrote no log file at all)"
            }
          }
          # **THE RESULT IS WRITTEN DOWN IN ONE PLACE, IN THE ITEM'S OWN TWO
          # SHAPES.** Silence does not close ASSA-205 and neither does a green
          # tick, so this says which of (a) and (b) happened and carries the text
          # either way.
          $result = Join-Path $out 'RESULT.md'
          $head = @(
            "# ASSA-205: the motion probe on a Windows runner",
            "",
            "Harness: GitHub Actions ``windows-latest``, run $($env:GITHUB_RUN_NUMBER), commit ``$($env:GITHUB_SHA.Substring(0,7))``.",
            "Godot $($env:GODOT_VERSION) editor binary on the project (the job comment says why not ``Assay.exe``).",
            "No GPU, seed $seed, $seconds s per attempt.",
            "**This is a fact about this runner. It is not the board's PC and it is not the exported zip.**",
            ""
          )
          if ($won -ne '') {
            $head += @("## RESULT (a): the probe ran, on driver ``$won``", "", '```')
            $head += (Get-Content (Join-Path $out "probe-$won.log"))
            $head += '```'
          } else {
            $head += @("## RESULT (b): could not run", "",
              "No driver opened a window the probe would measure. Every attempt's own output:")
            foreach ($d in $drivers) {
              $tag = if ($d -eq '') { 'default' } else { $d }
              $log = Join-Path $out "probe-$tag.log"
              $head += @("", "### driver ``$tag``", '```')
              if (Test-Path $log) { $head += (Get-Content $log | Select-Object -Last 40) }
              else { $head += "the engine wrote no log file" }
              $err = Join-Path $out "stderr-$tag.txt"
              if ((Test-Path $err) -and (Get-Item $err).Length -gt 0) {
                $head += "--- stderr:"
                $head += (Get-Content $err | Select-Object -Last 20)
              }
              $head += '```'
            }
          }
          Set-Content $result ($head -join "`n")
          Add-Content $env:GITHUB_STEP_SUMMARY ($head -join "`n")
          Get-Content $result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-probe-windows
          path: sim-game/client/probe-out
          # WARN, not ERROR, unlike every other upload here: if the job dies
          # before the probe step runs there is nothing to collect, and a missing
          # artifact must not become the loudest line in a log whose real failure
          # is further up.
          if-no-files-found: warn

  release:
    name: Attach bundles to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
      - uses: softprops/action-gh-release@v2
        with:
          files: bundles/**/*.zip
          generate_release_notes: true
