# Tests every push and PR, and builds downloadable Mac + Windows bundles.
#
# Where to get a bundle:
# - Any run: Actions tab → the run → "Artifacts" at the bottom (needs a
#   GitHub login).
# - Tagged builds: push a tag like `v0.1.0` and the zips are attached to a
#   GitHub Release, which anyone can download from the Releases page.
# - On demand: Actions tab → "Build" → "Run workflow".

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: sim-game

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim-game
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  macos:
    name: macOS bundle
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim-game
      - name: Build for both Mac chips
        run: >
          cargo build --release -p sim-cli -p sim-relay
          --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Bundle (universal binaries)
        run: |
          mkdir -p bundle/assay-macos
          for b in sim-cli sim-relay; do
            lipo -create \
              target/aarch64-apple-darwin/release/$b \
              target/x86_64-apple-darwin/release/$b \
              -output bundle/assay-macos/$b
            codesign -s - --force bundle/assay-macos/$b
          done
          cp packaging/README-macos.txt bundle/assay-macos/README.txt
          echo "Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d)" > bundle/assay-macos/VERSION.txt
          cd bundle && ditto -c -k --keepParent assay-macos assay-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: assay-macos
          path: sim-game/bundle/assay-macos.zip
          if-no-files-found: error

  windows:
    name: Windows bundle
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim-game
      - name: Build (static C runtime, no VC++ redistributable needed)
        run: cargo build --release -p sim-cli -p sim-relay
        env:
          RUSTFLAGS: -C target-feature=+crt-static
      - name: Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bundle/assay-windows | Out-Null
          Copy-Item target/release/sim-cli.exe, target/release/sim-relay.exe bundle/assay-windows/
          Copy-Item packaging/README-windows.txt bundle/assay-windows/README.txt
          "Built from $($env:GITHUB_SHA.Substring(0,7)) on $(Get-Date -Format yyyy-MM-dd -AsUTC)" | Set-Content bundle/assay-windows/VERSION.txt
          Compress-Archive -Path bundle/assay-windows -DestinationPath bundle/assay-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: assay-windows
          path: sim-game/bundle/assay-windows.zip
          if-no-files-found: error

  release:
    name: Attach bundles to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
      - uses: softprops/action-gh-release@v2
        with:
          files: bundles/**/*.zip
          generate_release_notes: true
