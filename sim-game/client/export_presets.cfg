; Export presets for the Assay client (ASSA-9).
;
; Checked in on purpose: CI exports from these, so a preset edited only in
; someone's editor would silently change what ships. There are no secrets in
; here -- codesign is disabled in the preset and done by the workflow on the
; macOS runner (`codesign -s -`, ad-hoc, same as the Rust binaries), so no
; identity or password ever lands in the repo.
;
; `export_path` is the default for a local `--export-release`; CI passes its
; own path as the last argument and that wins. ../dist is gitignored.
;
; tests/ and tools/ are excluded: the shipped client is not a test harness.

[preset.0]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*"
export_path="../dist/client/Assay.app"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

export/distribution_type=0
binary_format/architecture="universal"
application/bundle_identifier="games.r2ts.assay"
application/signature=""
application/short_version="0.1.0"
application/version="0.1.0"
application/copyright="r2ts-games"
display/high_res=true
codesign/codesign=0
notarization/notarization=0

[preset.1]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*"
export_path="../dist/client/Assay.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
application/modify_resources=false
application/product_name="Assay"
application/company_name="r2ts-games"
application/file_version="0.1.0"
application/product_version="0.1.0"
codesign/enable=false
